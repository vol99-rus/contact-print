<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Contact Print">
    <meta name="theme-color" content="#000000">
    <title>Contact Print</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mainScreen" class="screen active">
        <div class="header">
            <h1>◉ CONTACT PRINT</h1>
            <p class="subtitle">Контактная фотопечать</p>
        </div>

        <div class="preview-container" id="previewContainer">
            <div class="preview-placeholder" id="previewPlaceholder">
                <div class="preview-icon">⬜</div>
                <p>Нажмите чтобы загрузить фото</p>
            </div>
            <canvas id="previewCanvas" style="display:none;"></canvas>
        </div>

        <input type="file" id="fileInput" accept="image/*" style="display:none;">

        <div class="controls">
            <button class="btn btn-secondary" id="btnLoadPhoto">📷 Загрузить фото</button>

            <div class="options-row">
                <div class="option-toggle" id="optionBW">
                    <div class="toggle-switch">
                        <div class="toggle-knob"></div>
                    </div>
                    <span>Ч/Б негатив</span>
                </div>
                <div class="option-toggle" id="optionFill">
                    <div class="toggle-switch">
                        <div class="toggle-knob"></div>
                    </div>
                    <span>На весь экран</span>
                </div>
            </div>

            <div class="time-control">
                <label class="label">ВРЕМЯ ЭКСПОНИРОВАНИЯ</label>
                <div class="time-display" id="timeDisplay">10.0 сек</div>
                <div class="time-buttons">
                    <button class="btn-time" data-delta="-5">-5</button>
                    <button class="btn-time" data-delta="-1">-1</button>
                    <button class="btn-time" data-delta="-0.5">-0.5</button>
                    <button class="btn-time" data-delta="0.5">+0.5</button>
                    <button class="btn-time" data-delta="1">+1</button>
                    <button class="btn-time" data-delta="5">+5</button>
                </div>
                <input type="range" id="timeSlider" min="0.5" max="600" step="0.5" value="10">
            </div>

            <button class="btn btn-outline" id="btnPresets">📋 Пресеты</button>
            <button class="btn btn-primary" id="btnStart" disabled>⚡ НАЧАТЬ ЭКСПОНИРОВАНИЕ</button>
        </div>
    </div>

    <div id="exposureScreen" class="screen">
        <canvas id="exposureCanvas"></canvas>
        <div class="exposure-overlay">
            <div id="phaseIndicator" class="phase-indicator"></div>
            <button id="btnStop" class="btn-stop">✕</button>
        </div>
    </div>

    <div id="presetModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Пресеты</h2>
                <button class="btn-close-modal" id="btnClosePresets">✕</button>
            </div>
            <div class="preset-save">
                <button class="btn btn-outline" id="btnSavePreset">＋ Сохранить текущие настройки</button>
            </div>
            <div class="preset-list" id="presetList"></div>
            <div class="preset-add-form" id="presetForm" style="display:none;">
                <input type="text" id="presetNameInput" placeholder="Название пресета" class="input">
                <div class="form-row">
                    <button class="btn btn-secondary" id="btnConfirmPreset">Сохранить</button>
                    <button class="btn btn-outline" id="btnCancelPreset">Отмена</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
